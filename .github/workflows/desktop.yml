# Desktop app (apps/desktop): test, build Windows + Linux installers, and on desktop-v* tags
# create a DRAFT release. Nothing is published until a maintainer publishes the draft.
# Runbook: docs/desktop/RELEASE.md
name: desktop

on:
  push:
    branches: [master] # PR branches are covered by pull_request (one run per push, not two)
    tags: ["desktop-v*"]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_VERSION: "1.97.1"
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy,rustfmt && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Shared package
        run: npm test -w packages/shared && npm run typecheck -w packages/shared
      - name: Desktop frontend
        run: npm test -w apps/desktop && npm run lint -w apps/desktop && npm run build -w apps/desktop
      - name: Web app still passes
        run: npm test -w apps/web && npm run lint -w apps/web && npm run typecheck -w apps/web
      - name: Rust fmt, clippy, tests
        working-directory: apps/desktop/src-tauri
        run: |
          # tauri-build only checks that the bundled tools exist; the build job fetches the real ones.
          mkdir -p binaries
          for t in yt-dlp ffmpeg ffprobe deno; do touch "binaries/$t-x86_64-unknown-linux-gnu"; done
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc, so the AppImage/.deb run on older distros
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust ${{ env.RUST_VERSION }}
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Fetch pinned yt-dlp, ffmpeg, Deno (SHA-256 verified)
        run: npm run fetch-sidecars -w apps/desktop
      - name: Build installers
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Stable asset names
        shell: bash
        run: |
          mkdir -p out
          bundle=apps/desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bundle"/nsis/*-setup.exe out/dltube_x64-setup.exe
          else
            cp "$bundle"/appimage/*.AppImage out/dltube_amd64.AppImage
            cp "$bundle"/deb/*.deb out/dltube_amd64.deb
          fi
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

      # Smoke tests: the packaged tools run, and the app's real cut/convert code (dltube-cli built
      # with the CI-only local-test feature) cuts a generated video served on 127.0.0.1. No YouTube.
      - name: Harness for the local cut test
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --locked -p dltube-core --features local-test --bin dltube-cli
      - name: Smoke test (Linux .deb contents)
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -x out/dltube_amd64.deb "$RUNNER_TEMP/deb"
          tools=$(dirname "$(find "$RUNNER_TEMP/deb" -path '*/tools/yt-dlp')")
          ls -l "$tools"
          "$tools/yt-dlp" --version
          "$tools/ffmpeg" -hide_banner -version
          "$tools/deno" --version
          node apps/desktop/scripts/smoke-cut.mjs apps/desktop/src-tauri/target/release/dltube-cli "$tools" "$RUNNER_TEMP/smoke"
      - name: Smoke test (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'C:\dltube-test'
          $p = Start-Process out\dltube_x64-setup.exe -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          Get-ChildItem -Recurse $dir | Format-Table FullName, Length -AutoSize | Out-String -Width 200
          foreach ($t in 'yt-dlp', 'ffmpeg', 'ffprobe', 'deno') {
            if (-not (Test-Path "$dir\tools\$t.exe")) { throw "missing tools\$t.exe" }
          }
          & "$dir\tools\yt-dlp.exe" --version; if ($LASTEXITCODE) { throw 'yt-dlp --version failed' }
          & "$dir\tools\ffmpeg.exe" -hide_banner -version; if ($LASTEXITCODE) { throw 'ffmpeg -version failed' }
          & "$dir\tools\deno.exe" --version; if ($LASTEXITCODE) { throw 'deno --version failed' }
          node apps/desktop/scripts/smoke-cut.mjs apps\desktop\src-tauri\target\release\dltube-cli.exe "$dir\tools" "$env:RUNNER_TEMP\smoke"
          if ($LASTEXITCODE) { throw 'local cut test failed' }
      - name: YouTube from a CI runner (informational, never fails the build)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # One metadata lookup with the installed tools, to record whether YouTube blocks CI IPs.
          $t = 'C:\dltube-test\tools'
          $out = & "$t\yt-dlp.exe" --ignore-config --no-plugin-dirs --use-extractors youtube --no-js-runtimes --js-runtimes "deno:$t\deno.exe" --skip-download --no-playlist --print '%(id)s %(duration)s %(title)s' -- 'https://www.youtube.com/watch?v=jNQXAC9IVRw' 2>&1 | Out-String
          $result = if ($LASTEXITCODE -eq 0) { 'reachable' } elseif ($out -match 'confirm you.re not a bot|HTTP Error 429') { 'blocked' } else { 'failed' }
          $fence = '```'
          "YouTube metadata lookup from windows-latest: **$result**`n$fence`n$($out.Trim())`n$fence" >> $env:GITHUB_STEP_SUMMARY
          "result: $result"; $out
          exit 0
      - name: Launch the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'C:\dltube-test'
          $app = Start-Process "$dir\dltube.exe" -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\dltube-windows.png")
          if ($app.HasExited) { throw "dltube exited after start with code $($app.ExitCode)" }
          # Tauri's WebView2 runs with --user-data-dir under %LOCALAPPDATA%\app.dltube.desktop.
          $wv = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -match 'app\.dltube\.desktop' })
          "dltube running after 20 s (pid $($app.Id)); WebView2 processes: $($wv.Count)"
          if ($wv.Count -eq 0) { throw 'WebView2 did not start for dltube' }
          Stop-Process -Id $app.Id
          $app.WaitForExit(15000) | Out-Null
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          # The NSIS uninstaller re-launches itself from %TEMP%; wait for it to remove the files.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\dltube.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\dltube.exe") { throw 'uninstall left dltube.exe behind' }
          'uninstalled'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: windows-smoke-screenshot
          path: ${{ runner.temp }}/dltube-windows.png
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the app version
        run: |
          app=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          [ "desktop-v$app" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != Cargo.toml version $app"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: out
      - name: Checksums
        working-directory: out
        run: sha256sum dltube_* | tee SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft --verify-tag \
            --title "dltube ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Windows: dltube_x64-setup.exe. Linux: dltube_amd64.AppImage or dltube_amd64.deb. Verify downloads with SHA256SUMS. Installers are unsigned; see the download page for the Windows SmartScreen steps."
