services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  download-init:
    build: ./apps/api
    restart: "no"
    user: root
    command: ["chown", "-R", "app:app", "/app/tmp_downloads"]
    volumes:
      - downloads:/app/tmp_downloads

  api:
    build: ./apps/api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: &api_environment
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      DOWNLOAD_DIR: /app/tmp_downloads
    volumes:
      - downloads:/app/tmp_downloads
    depends_on:
      download-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment: *api_environment
    volumes:
      - downloads:/app/tmp_downloads
    depends_on:
      download-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: ./apps/api
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment: *api_environment
    volumes:
      - downloads:/app/tmp_downloads
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  downloads:
  redis-data:
