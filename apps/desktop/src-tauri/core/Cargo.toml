[package]
name = "dltube-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "yt-dlp driving logic for the dltube desktop app (no Tauri dependency, so it is testable headless)"

[features]
# CI only (the app never enables it): accept http://127.0.0.1 media via yt-dlp's generic extractor
# instead of YouTube, so the cut/convert path can be smoke-tested without YouTube. (yt-dlp can't
# cut sections from file:// URLs, hence a loopback HTTP server.)
local-test = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
ureq = "=3.5.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"
